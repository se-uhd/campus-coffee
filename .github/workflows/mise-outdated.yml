# Dependabot has no mise ecosystem, so this checks the mise-managed tools (the JDK, Gradle, gcloud, and
# python pinned in mise.toml): each week it runs `mise outdated --bump` and opens (or updates) an issue
# listing the pins that can be raised. It only notifies; bump the pins in mise.toml by hand.
name: mise outdated

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: read
  issues: write

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: false # only mise itself is needed; `mise outdated` does not need the tools installed

      - name: Report raisable pins as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --bump reports the version a hand edit of mise.toml would move to; plain `mise outdated`
          # compares against the newest version the pin already matches, which no edit can change.
          # --local skips the runner's global mise config.
          # capture the exit code explicitly: a failing `mise outdated` (network error, regression in a
          # newer mise) must fail the workflow visibly instead of being mistaken for "all up to date"
          set +e
          report="$(mise outdated --bump --local --json)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::mise outdated failed with exit code $status."
            exit 1
          fi

          # a null "bump" means the pin already names the latest version
          rows="$(printf '%s' "$report" | jq -r '
            to_entries[]
            | select(.value.bump != null)
            | "| \(.key) | `\(.value.requested)` | `\(.value.bump)` | \(.value.latest) |"
          ')"

          if [ -z "$rows" ]; then
            echo "Every mise.toml pin names the latest version."
            exit 0
          fi
          echo "Pins that can be raised:"
          echo "$rows"

          gh label create mise-outdated --color FBCA04 \
            --description "Outdated mise-managed tools" --force

          body="$(printf '`mise outdated --bump` reports these `mise.toml` pins as raisable:\n\n| tool | pinned | bump to | latest |\n| --- | --- | --- | --- |\n%s\n\nBump the pins by hand, then run `mise install`. Declining a bump is a valid outcome: the JDK tracks the LTS line, Gradle skips the milestone releases, and python follows what the gcloud components support. This issue is refreshed weekly.' "$rows")"

          existing="$(gh issue list --label mise-outdated --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            echo "Updated issue #$existing"
          else
            gh issue create --title "mise: outdated tools" --label mise-outdated --body "$body"
          fi
